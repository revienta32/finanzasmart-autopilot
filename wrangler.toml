name = "pureai-stripe-webhook"
main = "stripe-webhook-worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "PUREAI_LICENSES_KV"
id = "2ae8a9c8cd1f449b82cdc9033bac3e3d"
preview_id = "2ae8a9c8cd1f449b82cdc9033bac3e3d"

# Despliegue en Cloudflare Workers (Free Tier: 100.000 peticiones/día)
# Para configurar secretos en producción sin exponerlos en el código:
# npx wrangler secret put STRIPE_WEBHOOK_SECRET
# npx wrangler secret put NTFY_SECRET_TOPIC_URL

[triggers]
crons = ["0 9 * * *"]
