name: PureAI Studio — 24/7 Cloud Social Agent, SEO Indexer & Mobile Push Monitor

on:
  schedule:
    # Se ejecuta automáticamente en los servidores de GitHub (con tu PC apagado) 1 sola vez al día (08:30 UTC)
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  daily-operations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER: ${{ secrets.REDDIT_USER }}
      REDDIT_PASS: ${{ secrets.REDDIT_PASS }}
      PUREAI_MOBILE_NTFY_TOPIC: ${{ secrets.PUREAI_MOBILE_NTFY_TOPIC }}
      NTFY_SECRET_TOPIC_URL: ${{ secrets.NTFY_SECRET_TOPIC_URL }}
      ADMIN_DIGEST_TOKEN: ${{ secrets.ADMIN_DIGEST_TOKEN }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run 24/7 Cloud Social Radar, Mobile Push Digest, SEO IndexNow & Mandatory QA Suite
        run: |
          node auto-doctor.js
          node autopilot-ceo.js
          node test-qa.js

      - name: Commit and push verified operational metrics
        run: |
          git config user.name "PureAI Studio Ops Bot"
          git config user.email "ops@pureaistudios.com"
          git add sitemap.xml sitemap.txt index.html directorio-guias.html
          git diff --staged --quiet || git commit -m "chore(ops): cloud social radar, mobile digest & verified sitemap sync"
          git push
